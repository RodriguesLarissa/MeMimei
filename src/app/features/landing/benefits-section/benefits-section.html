<section class="benefits">
  <div class="container">
    <h2 class="benefits__title">Por que criar sua lista no MeMimei</h2>

    <div class="benefits__grid">
      @for (benefit of benefits; track benefit.title) {
        <article class="benefits__item">
          <span class="benefits__icon" aria-hidden="true">{{ benefit.icon }}</span>
          <div>
            <h3>{{ benefit.title }}</h3>
            <p>{{ benefit.description }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
