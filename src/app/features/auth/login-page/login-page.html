<section class="auth-page">
  <div class="auth-page__card">
    <h1>Entrar</h1>
    <p class="auth-page__subtitle">Acesse sua conta para gerenciar seus eventos.</p>

    @if (errorMessage()) {
      <ui-alert variant="error">{{ errorMessage() }}</ui-alert>
    } @else if (!isConfigured) {
      <ui-alert variant="info">
        O MeMimei ainda não está conectado a um banco de dados. Essa funcionalidade estará disponível em breve.
      </ui-alert>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-page__form">
      <label class="auth-page__field">
        <span>E-mail</span>
        <input type="email" formControlName="email" autocomplete="email" placeholder="voce@email.com" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="auth-page__error">Informe um e-mail válido.</span>
        }
      </label>

      <label class="auth-page__field">
        <span>Senha</span>
        <input type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="auth-page__error">Informe sua senha.</span>
        }
      </label>

      <ui-button type="submit" variant="primary" [fullWidth]="true" [loading]="isSubmitting()">
        Entrar
      </ui-button>
    </form>

    <p class="auth-page__links">
      <a routerLink="/recuperar-senha">Esqueci minha senha</a>
      <span>·</span>
      <a routerLink="/cadastro">Criar conta</a>
    </p>
  </div>
</section>
