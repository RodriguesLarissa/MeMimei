<header class="layout-header">
  <div class="container layout-header__inner">
    <a routerLink="/" class="layout-header__logo" aria-label="MeMimei, página inicial">
      Me<span class="layout-header__logo-accent">Mimei</span>
    </a>

    <nav class="layout-header__nav" aria-label="Navegação principal">
      <a routerLink="/" fragment="como-funciona">Como funciona</a>
      <a routerLink="/" fragment="ocasioes">Ocasiões</a>
      <a routerLink="/" fragment="faq">Perguntas frequentes</a>
    </nav>

    @if (authService.currentUser()) {
      <div class="layout-header__session">
        <a routerLink="/painel" class="layout-header__panel-link">Painel</a>
        <ui-button variant="ghost" (click)="signOut()">Sair</ui-button>
      </div>
    } @else {
      <div class="layout-header__session">
        <a routerLink="/entrar" class="layout-header__panel-link">Entrar</a>
        <ui-button variant="primary" routerLink="/cadastro">Crie sua lista</ui-button>
      </div>
    }
  </div>
</header>
