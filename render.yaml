services:
  - type: web
    name: memimei
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run serve:ssr:memimei
    envVars:
      - key: NODE_VERSION
        value: 24.18.1
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
